    model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    max_rpm: 40
    rate_limit_mode: "token_bucket"
    tags: ["general", "default"]
    enabled: true
  
  - name: reasoning
    model: "nvidia/nemotron-3-ultra-550b-a55b"
    max_rpm: 40
    rate_limit_mode: "strict"
