  - name: coding
    model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    max_rpm: 40
    rate_limit_mode: "token_bucket"
    tags: ["coding", "specialized", "programming"]
    enabled: true
  
  - name: disabled-example
    model: "nvidia/some-deprecated-model"
    max_rpm: 40
    rate_limit_mode: "token_bucket"
    tags: ["deprecated"]
